<section
  class="container anchor p-3 p-md-5"
  id="{{ .section.id }}"
  aria-labelledby="{{ .section.id }}-title"
>
  <div class="row justify-content-center">
    <div class="col-12 col-lg-9">
      <h2 id="{{ .section.id }}-title" class="mb-4">
        {{ .section.name }}
      </h2>

      <div class="portfolio-content">
        {{ .body | markdownify }}
      </div>

      <a class="btn btn-outline-primary mt-4" href="#home">
        첫 화면으로
      </a>
    </div>
  </div>
</section>
