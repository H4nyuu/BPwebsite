body: |
  ### GitHub Pages를 활용한 웹페이지 배포 실습

  - **활동 기간:** 2026년 10월 6일~10일
  - **진행 상태:** 완료
  - **수행 형태:** 개인 실습

  ### 목적

  수업 과제를 수행하며 GitHub를 통해 웹페이지를 공개하고,
  배포된 사이트에 접속하는 과정을 경험하는 것이 목표였습니다.

  ### 본인 역할과 수행 과정

  수업에서 제공된 HTML·CSS·JavaScript 템플릿을 받아 GitHub 공개 저장소에 올리고,
  GitHub Pages를 통해 배포했습니다.
  배포 후에는 사이트에 접속해 제공된 버튼 기능과 다른 브라우저에서의 동작을 확인했습니다.

  템플릿의 화면과 버튼 기능은 제공된 것이며,
  제가 직접 수행한 범위는 저장소 등록과 배포, 동작 확인입니다.
  도구와 배포 방법은 수업에서 지정한 방식을 사용했습니다.

  ### 결과

  제공된 팀 소개 템플릿을 공개 웹페이지로 배포했습니다.
  배포된 페이지에서 응원 버튼이 동작하고,
  다른 브라우저에서도 페이지를 이용할 수 있음을 확인했습니다.

  [배포 결과 보기 — 이전 수업 실습 사이트](https://h4nyuu.github.io/teamintro/)

  ### 배운 점과 당시의 한계

  GitHub Pages를 이용해 웹페이지를 공개할 수 있다는 점을 배웠습니다.
  또한 HTML은 페이지의 내용과 구조, CSS는 화면의 모양,
  JavaScript는 버튼 등의 동작을 담당한다는 것을 이해했습니다.

  다만 실습 당시에는 제공된 템플릿을 배포하는 데 집중했고,
  각 파일을 직접 수정하거나 새로운 기능을 추가하는 단계까지는 진행하지 못했습니다.

  ### 다음 개선 방향

  HTML의 기본 구조와 JavaScript의 이벤트 처리를 학습한 뒤,
  기존 템플릿에 새로운 기능을 추가해 볼 계획입니다.

  ### 제공 자료 출처

  전북대학교 2026학년도 2학기 초급프로젝트 1분반 수업 제공 템플릿
